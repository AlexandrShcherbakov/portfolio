    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.05 0 0 0 0 0.95 0 0 0 0 0.78 0 0 0 .55 0"/>
    </filter>
    <filter id="tight" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .glow { fill:none; stroke:#2EF0D2; stroke-width:9; stroke-linecap:round; stroke-linejoin:round; opacity:.42; filter:url(#glow); }
      .cut { fill:url(#cutFill); filter:url(#tight); }
      .hot { fill:none; stroke:#E8FFFB; stroke-width:1.2; stroke-linecap:round; opacity:.72; }
      .blade { fill:url(#gBladeFill); filter:url(#tight); }
      .strong { font-family:Inter, Segoe UI, Arial, sans-serif; font-weight:700; fill:#EEF4F1; letter-spacing:-5px; }
      .light { font-family:Inter, Segoe UI, Arial, sans-serif; font-weight:300; fill:#E9EEEC; letter-spacing:-5px; }
    </style>
