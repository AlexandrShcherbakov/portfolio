  <defs>
    <linearGradient id="cutFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8FFFB"/>
      <stop offset="42%" stop-color="#2EF0D2"/>
      <stop offset="100%" stop-color="#0CB7A8"/>
    </linearGradient>
    <linearGradient id="gBladeFill" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2EF0D2" stop-opacity="0.95"/>
